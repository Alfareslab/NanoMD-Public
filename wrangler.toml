#:schema node_modules/wrangler/config-schema.json
name = "nanomd"
main = "src/worker.ts"
compatibility_date = "2024-12-01"

[site]
bucket = "./dist"

[[kv_namespaces]]
binding = "SHARED_CONTENT"
id = "YOUR_KV_NAMESPACE_ID"
# Create your own KV namespace: wrangler kv:namespace create SHARED_CONTENT

[ai]
binding = "AI"
